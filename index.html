<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graduación Estrategias Comerciales 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
/* Concepto: sobre negro con solapa roja que se abre al tocar el sello; la carta sube y se centra a tamaño completo. */
:root{
  --ink:#0a0a0b;
  --coal:#17171a;
  --coal-2:#222226;
  --red:#e3121c;
  --red-deep:#8f0b12;
  --bone:#f4f0ea;
  --mute:#a6a29c;
  --display:"Syne","Arial Black",Impact,sans-serif;
  --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --w:min(92vw,420px,calc(100svh - 190px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--body);padding-inline:16px;overflow-x:hidden}
.scene{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;isolation:isolate}
.scene::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(60% 45% at 50% 55%,rgba(227,18,28,.16),transparent 70%),
             linear-gradient(var(--ink),#0e0e10)}
.eyebrow{position:absolute;top:7svh;left:0;right:0;text-align:center;font:700 .72rem/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);transition:opacity .5s}
.eyebrow b{color:var(--red);font-weight:700}
.hint{position:absolute;bottom:9svh;left:0;right:0;text-align:center;font:500 .95rem/1.3 var(--body);color:var(--bone);transition:opacity .5s}
.hint small{display:block;margin-top:.4rem;color:var(--mute);font-size:.78rem}

/* sobre */
.envelope{position:relative;width:calc(var(--w)*.9);height:calc(var(--w)*.6);transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .8s;perspective:1200px}
.back{position:absolute;inset:0;background:var(--coal-2);border-radius:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05)}
.clip{position:absolute;inset:0;z-index:2;clip-path:inset(0 -2% 0 -2%);transition:clip-path .9s ease}
.pocket{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:6px;overflow:hidden}
.pocket i{position:absolute;inset:0;display:block}
.pocket .l{background:linear-gradient(100deg,#1c1c20,#141417);clip-path:polygon(0 0,52% 52%,0 100%)}
.pocket .r{background:linear-gradient(260deg,#1f1f23,#151518);clip-path:polygon(100% 0,48% 52%,100% 100%)}
.pocket .b{background:linear-gradient(0deg,#101012,#1a1a1e);clip-path:polygon(0 100%,50% 48%,100% 100%)}
.pocket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red)}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .35s}
.flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .f{background:linear-gradient(180deg,#26262b,#1b1b1f)}
.flap .bk{background:linear-gradient(180deg,var(--red),var(--red-deep));transform:rotateX(180deg)}
.seal{position:absolute;z-index:5;left:50%;top:56%;width:calc(var(--w)*.2);aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ff3a43,var(--red) 55%,var(--red-deep));color:#fff;display:grid;place-content:center;text-align:center;
  font-family:var(--display);font-weight:800;line-height:.95;box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.18);transition:opacity .3s,scale .3s}
.seal b{display:block;font-size:calc(var(--w)*.075)}
.seal span{display:block;font-size:calc(var(--w)*.032);letter-spacing:.14em;margin-top:.15em}
.seal::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--red);animation:pulse 2s ease-out infinite}
.seal:hover{scale:1.06}
.seal:focus-visible{outline:3px solid var(--bone);outline-offset:6px}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* carta */
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card{position:absolute;left:50%;bottom:6px;width:var(--w);height:var(--w);margin-left:calc(var(--w)/-2);
  transform-origin:50% 100%;transform:translateY(0) scale(.64);overflow:hidden;
  background:var(--ink);border-radius:calc(var(--w)*.025);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px -20px rgba(0,0,0,.9);
  transition:transform 1s cubic-bezier(.5,0,.15,1)}

/* estados */
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{opacity:0;pointer-events:none}
.open .eyebrow,.open .hint{opacity:0}
.rise .clip{clip-path:inset(-300% -60% 0 -60%)}
.rise .card{transform:translateY(calc(var(--w)*-.42)) scale(.64)}
.reveal .clip{clip-path:none;z-index:6}
.reveal .envelope{transform:translateY(60svh);pointer-events:none}
.back,.pocket{transition:opacity .6s}
.reveal .back,.reveal .pocket,.reveal .flap{opacity:0}
.reveal .card{transform:translateY(calc(var(--w)*.2 - 60svh)) scale(1)}
.after{position:absolute;left:0;right:0;bottom:2.2svh;display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:0;pointer-events:none;transition:opacity .6s .9s;z-index:7}
.reveal .after{opacity:1;pointer-events:auto}
.count{font:500 .85rem/1 var(--body);color:var(--mute);font-variant-numeric:tabular-nums}
.count b{color:var(--bone);font-weight:700}
.close{background:none;border:1px solid rgba(255,255,255,.25);color:var(--bone);font:500 .8rem/1 var(--body);padding:.6rem 1rem;border-radius:99px;cursor:pointer}
.close:hover{border-color:var(--red)}
.close:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* brillos */
.fx{position:absolute;left:0;top:0;width:0;height:0;z-index:9;pointer-events:none}
.fx i{position:absolute;left:0;top:0;display:block;will-change:transform,opacity}
.fx .st{background:var(--c,#fff);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px var(--c,#fff))}
.fx .rg{border:2px solid var(--red);border-radius:50%;box-shadow:0 0 18px rgba(227,18,28,.7),inset 0 0 14px rgba(227,18,28,.5)}
.fx .fl{border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,70,80,.55) 35%,transparent 70%)}
.rays{position:absolute;left:50%;top:50%;width:min(190vw,1200px);aspect-ratio:1;translate:-50% -50%;pointer-events:none;opacity:0;transition:opacity 1.2s .6s;
  background:repeating-conic-gradient(from 0deg,rgba(255,70,80,.42) 0 5deg,transparent 5deg 16deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 66%);mask-image:radial-gradient(circle,#000 8%,transparent 66%);animation:giro 40s linear infinite}
.reveal .rays{opacity:1}
@keyframes giro{to{transform:rotate(360deg)}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;background:radial-gradient(circle at 50% 56%,rgba(255,255,255,.95),rgba(255,60,70,.5) 40%,transparent 75%)}
.fx .tw{background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ff3a43)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.85) 50%,transparent 64%);mix-blend-mode:screen}
.reveal .card::after{animation:sweep 3.6s .85s ease-in-out infinite}
.reveal .card{animation:glow 2.4s .9s ease-out both,pulso 2.6s 3.3s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-130%)}38%,100%{transform:translateX(130%)}}
@keyframes glow{0%{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px -20px rgba(0,0,0,.9)}
  35%{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 120px 28px rgba(227,18,28,.85)}
  100%{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 60px 6px rgba(227,18,28,.35)}}
@keyframes pulso{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 60px 6px rgba(227,18,28,.35)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 110px 22px rgba(227,18,28,.6)}}
/* zoom de la carta */
.reveal .card{pointer-events:auto;cursor:zoom-in}
.tip{font:500 .78rem/1 var(--body);color:var(--mute)}
.zoom{position:fixed;inset:0;z-index:50;visibility:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.zoom.on{visibility:visible}
.zbg{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  background:radial-gradient(60% 50% at 50% 50%,rgba(227,18,28,.24),transparent 70%),rgba(6,6,7,.94)}
.zoom.show .zbg{opacity:1}
.zstage{--z:min(calc(100vw - 24px),calc(100svh - 110px),900px);position:absolute;left:50%;top:50%;width:var(--z);height:var(--z);
  margin:calc(var(--z)/-2) 0 0 calc(var(--z)/-2);border-radius:calc(var(--z)*.025);overflow:hidden;transform-origin:50% 50%;will-change:transform;cursor:zoom-in;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 90px 10px rgba(227,18,28,.4),0 30px 80px -10px #000}
.zstage.zoomed{cursor:grab}
.zstage.smooth{transition:transform .55s cubic-bezier(.2,.85,.25,1)}
.zstage img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.zclose{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));right:14px;background:rgba(10,10,11,.7);border:1px solid rgba(255,255,255,.3);color:var(--bone);
  font:500 .85rem/1 var(--body);padding:.7rem 1.1rem;border-radius:99px;cursor:pointer}
.zclose:hover{border-color:var(--red)}
.zclose:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.zhint{position:absolute;z-index:10;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));margin:0;text-align:center;font:500 .8rem/1.3 var(--body);color:var(--mute);pointer-events:none;transition:opacity .8s}
@media (prefers-reduced-motion:reduce){
  .zbg,.zstage.smooth,.zhint{transition-duration:.01s!important}
  .reveal .card,.reveal .card::after{animation:none}
  .fx,.flash,.rays{display:none}
  .flap,.clip,.card,.envelope,.after,.eyebrow,.hint{transition-duration:.01s!important;transition-delay:0s!important}
  .seal::before{animation:none}
}
</style>

</head>
<body>
<main class="scene" id="scene">
  <p class="eyebrow">Desarrollo <b>Organizacionl</b> te invita</p>

  <div class="rays" aria-hidden="true"></div>

  <div class="envelope" id="envelope">
    <div class="back"></div>
    <div class="clip">
      <article class="card"><img src="invitacion.jpeg" alt="Invitación: Más que clientes, construimos confianza. Graduación de Fuerza Comercial Efectiva, Estrategias Comerciales 2.0. 29 de octubre, 10h00, Hotel Dann Carlton, Quito."></article>
    </div>
    <div class="pocket" aria-hidden="true"><i class="l"></i><i class="r"></i><i class="b"></i></div>
    <div class="flap" aria-hidden="true"><i class="f"></i><i class="bk"></i></div>
    <button class="seal" id="seal" type="button" aria-label="Abrir la invitación"><b>29</b><span>OCT</span></button>
  </div>

  <p class="hint">Toca el sello para abrir<small>Graduación · Fuerza Comercial Efectiva</small></p>

  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <div class="after">
    <span class="tip">Toca la carta para ampliarla</span>
    <span class="count" id="count"></span>
    <button class="close" id="close" type="button">Cerrar la carta</button>
  </div>
</main>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Invitación ampliada" aria-hidden="true">
  <div class="zbg" id="zbg"></div>
  <div class="zstage" id="zstage"><img src="invitacion.png" alt="Invitación ampliada: Más que clientes, construimos confianza. Graduación de Fuerza Comercial Efectiva, Estrategias Comerciales 2.0. 29 de octubre, 10h00, Hotel Dann Carlton, Quito." draggable="false"></div>
  <div class="fx" id="zfx" aria-hidden="true"></div>
  <p class="zhint" id="zhint">Toca la imagen para acercar · pellizca para ampliar</p>
  <button class="zclose" id="zclose" type="button">Cerrar</button>
</div>

<script>
(function(){
  var scene=document.getElementById('scene');
  var seal=document.getElementById('seal');
  var timers=[];
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function later(fn,ms){timers.push(setTimeout(fn,reduce?0:ms))}

  var fx=document.getElementById('fx');
  var host=fx;
  var colores=['#ffffff','#ff3a43','#e3121c','#ffd9c9'];
  function centro(el){
    var a=el.getBoundingClientRect(),s=scene.getBoundingClientRect();
    return {x:a.left+a.width/2-s.left,y:a.top+a.height/2-s.top,w:a.width};
  }
  function pieza(clase,x,y,w,keys,opt){
    var el=document.createElement('i');
    el.className=clase;
    el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+w+'px;margin:'+(-w/2)+'px 0 0 '+(-w/2)+'px;opacity:0';
    host.appendChild(el);
    var an=el.animate(keys,opt);
    an.onfinish=function(){el.remove()};
  }
  function chispas(x,y,n,radio,tam){
    for(var k=0;k<n;k++){
      var ang=(Math.PI*2*k/n)+Math.random()*.5;
      var d=radio*(.55+Math.random()*.6);
      var dx=Math.cos(ang)*d,dy=Math.sin(ang)*d+radio*.15;
      var w=tam*(.5+Math.random()*.9);
      var el=document.createElement('i');
      el.className='st';
      el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+w+'px;margin:'+(-w/2)+'px 0 0 '+(-w/2)+'px;--c:'+colores[k%colores.length]+';opacity:0';
      host.appendChild(el);
      var giro=(Math.random()*180-90)+'deg';
      var an=el.animate([
        {transform:'translate(0,0) scale(0) rotate(0deg)',opacity:1},
        {transform:'translate('+dx*.7+'px,'+dy*.7+'px) scale(1.1) rotate('+giro+')',opacity:1,offset:.45},
        {transform:'translate('+dx+'px,'+(dy+radio*.25)+'px) scale(0) rotate('+giro+')',opacity:0}
      ],{duration:900+Math.random()*700,easing:'cubic-bezier(.15,.7,.3,1)',delay:Math.random()*120});
      an.onfinish=(function(e){return function(){e.remove()}})(el);
    }
  }
  function destello(x,y,w){
    pieza('fl',x,y,w,[{transform:'scale(.2)',opacity:1},{transform:'scale(9)',opacity:0}],{duration:900,easing:'ease-out'});
    for(var r=0;r<3;r++){
      pieza('rg',x,y,w,[{transform:'scale(.6)',opacity:1},{transform:'scale('+(8+r*3)+')',opacity:0}],{duration:1100+r*250,delay:r*160,easing:'cubic-bezier(.2,.6,.3,1)'});
    }
  }
  function flash(fuerza){
    document.getElementById('flash').animate([{opacity:fuerza},{opacity:0}],{duration:700,easing:'ease-out'});
  }
  var timerTw=null;
  function brillo(){
    if(reduce)return;
    var s=centro(seal);
    flash(.55);
    destello(s.x,s.y,s.w);
    chispas(s.x,s.y,70,s.w*5.2,s.w*.34);
    chispas(s.x,s.y,36,s.w*2.6,s.w*.5);
    try{if(navigator.vibrate)navigator.vibrate([30,40,30])}catch(e){}
  }
  function brilloCarta(){
    if(reduce)return;
    var c=centro(document.querySelector('.card'));
    flash(.4);
    destello(c.x,c.y,c.w*.2);
    chispas(c.x,c.y,60,c.w*1.1,c.w*.09);
    chispas(c.x,c.y-c.w*.25,40,c.w*.8,c.w*.07);
    chispas(c.x,c.y+c.w*.25,40,c.w*.8,c.w*.07);
    brillar();
  }
  function brillar(){
    clearInterval(timerTw);
    timerTw=setInterval(function(){
      var k=document.querySelector('.card').getBoundingClientRect(),s=scene.getBoundingClientRect();
      for(var n=0;n<2;n++){
        var w=k.width*(.035+Math.random()*.055);
        var x=k.left-s.left+Math.random()*k.width,y=k.top-s.top+Math.random()*k.height;
        pieza('tw',x,y,w,[{transform:'scale(0) rotate(0deg)',opacity:0},{transform:'scale(1.2) rotate(45deg)',opacity:1,offset:.5},{transform:'scale(0) rotate(90deg)',opacity:0}],{duration:900+Math.random()*600,easing:'ease-in-out'});
      }
    },170);
  }
  function abrir(){
    if(scene.classList.contains('open'))return;
    brillo();
    scene.classList.add('open');
    later(function(){scene.classList.add('rise')},650);
    later(function(){scene.classList.add('reveal');cardEl.tabIndex=0;cardEl.setAttribute('role','button');cardEl.setAttribute('aria-label','Ampliar la invitación')},1900);
    later(brilloCarta,2800);
  }
  function cerrar(){
    timers.forEach(clearTimeout);timers=[];clearInterval(timerTw);
    scene.classList.remove('reveal');
    cardEl.removeAttribute('tabindex');cardEl.removeAttribute('role');cardEl.removeAttribute('aria-label');
    later(function(){scene.classList.remove('rise')},300);
    later(function(){scene.classList.remove('open')},1100);
  }
  seal.addEventListener('click',abrir);
  document.getElementById('envelope').addEventListener('click',function(e){if(e.target!==seal)abrir()});
  document.getElementById('close').addEventListener('click',cerrar);

  // ---- zoom de la carta ----
  var zoomEl=document.getElementById('zoom'),stage=document.getElementById('zstage'),zfx=document.getElementById('zfx'),zhint=document.getElementById('zhint');
  var cardEl=document.querySelector('.card');
  var zOpen=false,k=1,tx=0,ty=0,MAXK=5,pts=new Map(),startK=1,startDist=1,moved=0,down=null,hintT=null;
  function vw(){return zoomEl.clientWidth}
  function vh(){return zoomEl.clientHeight}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function limite(){
    var S=stage.offsetWidth*k,mx=Math.max(0,(S-vw())/2),my=Math.max(0,(S-vh())/2);
    tx=clamp(tx,-mx,mx);ty=clamp(ty,-my,my);
  }
  function aplicar(suave){
    stage.classList.toggle('smooth',!!suave);
    stage.classList.toggle('zoomed',k>1);
    stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
  }
  function zoomEn(px,py,k2,suave){
    k2=clamp(k2,1,MAXK);
    var ox=px-vw()/2,oy=py-vh()/2;
    tx=ox-(ox-tx)*k2/k;ty=oy-(oy-ty)*k2/k;k=k2;
    if(k===1){tx=0;ty=0}
    limite();aplicar(suave);
  }
  function reset(suave){k=1;tx=0;ty=0;aplicar(suave)}
  function geom(){
    var c=cardEl.getBoundingClientRect();
    return {dx:c.left+c.width/2-vw()/2,dy:c.top+c.height/2-vh()/2,s:c.width/stage.offsetWidth};
  }
  function abrirZoom(){
    if(zOpen)return;
    zOpen=true;
    zoomEl.classList.add('on');
    zoomEl.setAttribute('aria-hidden','false');
    k=1;tx=0;ty=0;stage.className='zstage';stage.style.transform='';
    var g=geom(),dur=reduce?1:700;
    cardEl.style.visibility='hidden';
    void zoomEl.offsetWidth;
    zoomEl.classList.add('show');
    stage.animate([
      {transform:'translate('+g.dx+'px,'+g.dy+'px) scale('+g.s+') rotate(-3deg)',filter:'brightness(1.5)'},
      {transform:'translate(0,0) scale(1.03) rotate(0deg)',filter:'brightness(1.15)',offset:.7},
      {transform:'translate(0,0) scale(1) rotate(0deg)',filter:'brightness(1)'}
    ],{duration:dur,easing:'cubic-bezier(.2,.9,.25,1)'});
    if(!reduce){
      later(function(){
        var S=stage.offsetWidth;
        host=zfx;
        destello(vw()/2,vh()/2,S*.08);
        chispas(vw()/2,vh()/2,50,S*.75,S*.05);
        host=fx;
        try{if(navigator.vibrate)navigator.vibrate(20)}catch(e){}
      },220);
    }
    zhint.style.opacity=1;
    clearTimeout(hintT);hintT=setTimeout(function(){zhint.style.opacity=0},3200);
    document.getElementById('zclose').focus({preventScroll:true});
  }
  function cerrarZoom(){
    if(!zOpen)return;
    zOpen=false;pts.clear();
    var cur=getComputedStyle(stage).transform;
    stage.classList.remove('smooth','zoomed');
    var g=geom(),dur=reduce?1:560;
    zoomEl.classList.remove('show');
    var an=stage.animate([
      {transform:cur==='none'?'translate(0,0) scale(1)':cur},
      {transform:'translate('+g.dx+'px,'+g.dy+'px) scale('+g.s+') rotate(2deg)'}
    ],{duration:dur,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
    an.onfinish=function(){
      zoomEl.classList.remove('on');
      zoomEl.setAttribute('aria-hidden','true');
      cardEl.style.visibility='';
      stage.style.transform='';
      an.cancel();
      k=1;tx=0;ty=0;
      try{cardEl.focus({preventScroll:true})}catch(e){}
    };
  }
  function medio(){
    var a=Array.from(pts.values()),n=a.length,x=0,y=0;
    a.forEach(function(p){x+=p.x;y+=p.y});
    return {x:x/n,y:y/n};
  }
  function dist(){
    var a=Array.from(pts.values());
    return a.length<2?1:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
  }
  zoomEl.addEventListener('pointerdown',function(e){
    if(e.target.closest('.zclose'))return;
    try{zoomEl.setPointerCapture(e.pointerId)}catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    stage.classList.remove('smooth');
    if(pts.size===1){moved=0;down={x:e.clientX,y:e.clientY,t:Date.now(),target:e.target}}
    else if(pts.size===2){startK=k;startDist=dist();moved=99}
  });
  zoomEl.addEventListener('pointermove',function(e){
    var p=pts.get(e.pointerId);
    if(!p)return;
    if(pts.size===2){
      var antes=medio();
      p.x=e.clientX;p.y=e.clientY;
      var m=medio();
      tx+=m.x-antes.x;ty+=m.y-antes.y;
      zoomEn(m.x,m.y,startK*dist()/startDist,false);
    }else{
      var dx=e.clientX-p.x,dy=e.clientY-p.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      p.x=e.clientX;p.y=e.clientY;
      if(k>1){tx+=dx;ty+=dy;limite();aplicar(false)}
    }
  });
  function fin(e,cancel){
    if(!pts.has(e.pointerId))return;
    pts.delete(e.pointerId);
    if(pts.size>0)return;
    if(!cancel&&down&&moved<8&&Date.now()-down.t<400){
      var t=down.target;
      if(t.closest&&t.closest('#zstage')){
        if(k>1)reset(true);else zoomEn(e.clientX,e.clientY,2.6,true);
      }else cerrarZoom();
    }else if(k<1.05)reset(true);
    down=null;
  }
  zoomEl.addEventListener('pointerup',function(e){fin(e,false)});
  zoomEl.addEventListener('pointercancel',function(e){fin(e,true)});
  zoomEl.addEventListener('wheel',function(e){
    e.preventDefault();
    zoomEn(e.clientX,e.clientY,k*Math.exp(-e.deltaY*.0015),false);
  },{passive:false});
  document.getElementById('zclose').addEventListener('click',cerrarZoom);
  cardEl.addEventListener('click',function(){if(scene.classList.contains('reveal'))abrirZoom()});
  cardEl.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&scene.classList.contains('reveal')){e.preventDefault();abrirZoom()}
  });
  document.addEventListener('keydown',function(e){
    if(!zOpen)return;
    if(e.key==='Escape')cerrarZoom();
    else if(e.key==='+'||e.key==='=')zoomEn(vw()/2,vh()/2,k*1.4,true);
    else if(e.key==='-')zoomEn(vw()/2,vh()/2,k/1.4,true);
  });

  // cuenta regresiva hasta el 29 de octubre de 2026, 10h00 (Ecuador, UTC-5)
  var evento=Date.UTC(2026,9,29,15,0,0);
  var c=document.getElementById('count');
  var d=Math.ceil((evento-Date.now())/86400000);
  if(d>1)c.innerHTML='Faltan <b>'+d+'</b> días';
  else if(d===1)c.innerHTML='Es <b>mañana</b>';
  else if(evento-Date.now()>-6*3600000)c.innerHTML='Es <b>hoy</b>';
  else c.textContent='¡Gracias por acompañarnos!';
})();
</script>
